<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4efdf">
  <meta name="description" content="You made the mess. Now spill the tea. Leave OBK a 90-second Toxic Confession.">
  <meta name="robots" content="index,follow">
  <meta property="og:title" content="Toxic Confessions — OBK">
  <meta property="og:description" content="You made the mess. Now spill the tea.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://toxicconfessions.co/">
  <meta property="og:image" content="https://toxicconfessions.co/assets/toxic-confessions-logo.png">
  <title>Toxic Confessions — OBK</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23ee4b2b'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Arial Black,sans-serif' font-size='32' fill='white'%3ETC%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#ready-to-confess">Skip to recorder</a>


  <main>
    <section class="recorder-section recorder-section--first" id="ready-to-confess" aria-labelledby="recorder-title">
      <div class="lean-intake-copy">
        <h1 id="hero-title"><span>TOXIC</span><br><strong>CONFESSION</strong></h1>
        <p class="hero-dek">You made the mess. Now spill the tea.</p>
        <p class="callback-plain"><strong>Leave a confession.</strong> <span>You have 90 seconds.</span></p>
      </div>

      <div class="recorder-shell">
        <div class="recorder-label">
          <span class="hotline-status"><span class="status-dot" aria-hidden="true"></span> HOTLINE OPEN</span>
          <span>MAX 01:30</span>
        </div>

        <div class="consent-gate" id="consent-gate">
          <h2 class="gate-kicker" id="recorder-title">leave your confession.</h2>
          <label class="check-row">
            <input type="checkbox" id="consent-check">
            <span>I'm 18 or older, and I give OBK permission to edit, play, publish, and discuss my recording in podcast, video, social, and promotional content without payment.</span>
          </label>

          <button class="open-recorder" id="open-recorder" type="button" data-destination="https://podline.fm/toxic-confessions" disabled>CONFESS</button>
          <p class="gate-note">Submission does not guarantee airtime.</p>
        </div>
      </div>
    </section>

    <section class="host-proof" aria-label="OBK hosts">
      <figure class="host-card">
        <div class="photo-wrap">
          <img src="assets/obk-hosts.webp" width="1280" height="720" alt="The two OBK hosts reacting with surprised expressions">
        </div>
        <figcaption>YOUR STORY <span>→</span> OBK'S REACTION <span>→</span> CLASSMATE VERDICT</figcaption>
      </figure>
    </section>
  </main>

  <footer>
    <p><strong>Toxic Confessions</strong></p>
    <p><a href="https://onlyblackkids.com">OnlyBlackKids.com</a></p>
    <p class="copyright">© <span id="year"></span> Only Black Kids</p>
  </footer>
</body>
</html>
